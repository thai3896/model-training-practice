<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kokoro Dataset Preview</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f7fafc; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .row { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid #e2e8f0; transition: background-color 0.2s; }
        .row:hover { background-color: #ebf8ff; }
        .row:last-child { border-bottom: none; }
        .text { flex-grow: 1; padding-right: 20px; font-size: 15px; color: #2d3748; line-height: 1.5; }
        .audio-player { flex-shrink: 0; }
        .nav { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        a { color: #3182ce; text-decoration: none; font-weight: bold; background: #ebf8ff; padding: 8px 16px; border-radius: 6px; }
        a:hover { background: #bee3f8; }
        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-left: 10px; }
        .status-ready { background-color: #c6f6d5; color: #22543d; }
        .status-missing { background-color: #fed7d7; color: #742a2a; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <h2 style="margin: 0; color: #2a4365;">🎧 Kokoro Dataset Preview</h2>
            <a href="/index.html">⬅️ Back to Recording Studio</a>
        </div>
        <p style="color: #718096; margin-bottom: 30px; font-size: 14px;">Review the 100 reference audio files generated by the Kokoro API. These files make up the dataset that the AI will use to learn the voice.</p>
        
        <div id="listContainer">
            <div style="text-align: center; color: #a0aec0; padding: 40px;">Loading dataset...</div>
        </div>
    </div>

    <script>
        function pad(num) {
            return num.toString().padStart(3, '0');
        }

        fetch('/api/script')
            .then(res => res.json())
            .then(data => {
                const listContainer = document.getElementById('listContainer');
                listContainer.innerHTML = '';
                
                if (data.lines && data.lines.length > 0) {
                    data.lines.forEach((line, index) => {
                        const fileNum = pad(index + 1);
                        const audioSrc = `/dataset/wavs/kokoro_generated_${fileNum}.wav`;
                        const cleanText = line.replace(/^\d+\.\s*/, '');
                        
                        const row = document.createElement('div');
                        row.className = 'row';
                        
                        // Check if the audio file actually exists
                        fetch(audioSrc, { method: 'HEAD' })
                            .then(res => {
                                const badge = res.ok 
                                    ? `<span class="status-badge status-ready">✅ Ready</span>` 
                                    : `<span class="status-badge status-missing">❌ Missing</span>`;
                                
                                row.innerHTML = `
                                    <div class="text">
                                        <strong>${index + 1}.</strong> ${cleanText}
                                        ${badge}
                                    </div>
                                    <div class="audio-player">
                                        <audio controls src="${res.ok ? audioSrc : ''}" preload="none" style="height: 35px; width: 280px;"></audio>
                                    </div>
                                `;
                            }).catch(() => {
                                row.innerHTML = `
                                    <div class="text"><strong>${index + 1}.</strong> ${cleanText} <span class="status-badge status-missing">❌ Error</span></div>
                                    <div class="audio-player"><audio controls style="height: 35px; width: 280px;"></audio></div>
                                `;
                            });

                        listContainer.appendChild(row);
                    });
                } else {
                    listContainer.innerHTML = '<div style="text-align: center; color: #e53e3e; padding: 40px;">No script lines found in recording_script.txt</div>';
                }
            })
            .catch(err => {
                document.getElementById('listContainer').innerHTML = '<div style="text-align: center; color: #e53e3e; padding: 40px;">Error loading dataset.</div>';
                console.error(err);
            });
    </script>
</body>
</html>
